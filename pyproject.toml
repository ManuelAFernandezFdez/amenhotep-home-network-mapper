[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amenhotep"
version = "0.1.0"
description = "Discover, identify and map home network devices"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "defusedxml>=0.7",
  "zeroconf>=0.130",
  "pyyaml>=6",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
mdns = ["zeroconf>=0.130"]
dev = ["pytest>=8", "pytest-qt", "pytest-cov", "ruff", "mypy", "jsonschema>=4", "types-defusedxml", "types-PyYAML", "types-jsonschema"]

[project.scripts]
amenhotep = "amenhotep.cli:main"

[project.gui-scripts]
amenhotep-gui = "amenhotep.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amenhotep = ["data/*.csv", "data/*.json", "data/*.yaml", "data/*.svg", "store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: real-network lab tests (root, opt-in)", "gui: Qt tests"]
addopts = "-m 'not lab'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/amenhotep"]
plugins = ["pydantic.mypy"]
